<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar una mascota - HuelliTas</title>
    <link rel="stylesheet" href="publicar.css">
</head>
<body>
    <header>
        <h2><img src="img/logo.png" alt="Logo HuelliTas"> Huellitas</h2>
        <nav>
            <a href="../index.html">Inicio</a>
            <a href="rescatistas.html">Soy rescatista ▼</a>
            <a href="adoptante.html">Soy adoptante ▼</a>
            <a href="login.html">👤</a>
        </nav>
    </header>
    <main>
        <h1 class="titulo">Publicar una mascota</h1>
        <form class="publicar">
            <section class="tarjeta">
                <h2>Información de la mascota</h2>
                <section class="info">
                    <label class="imagen" for="foto">
                        <img id="vista" alt="Vista previa de la mascota">
                        <span class="camara">📷</span>
                        <strong>Agregar una imagen</strong>
                        <small>Agregar una imagen del perrito que quieres ayudar</small>
                    </label>
                    <input type="file" id="foto" accept="image/*">
                    <section class="datos">
                        <label for="nombre">Nombre de la mascota (opcional)</label>
                        <input type="text" id="nombre" placeholder="Ej: Toby">
                        <label for="edad">Edad aproximada</label>
                        <input type="text" id="edad" placeholder="Ej: 2 años">
                        <label for="peso">Peso aproximado (campo no obligatorio)</label>
                        <input type="text" id="peso" placeholder="Ej: 10 kg aproximadamente">
                    </section>
                </section>
            </section>
            <section class="tarjeta">
                <fieldset>
                    <legend>Sexo</legend>
                    <section class="opciones">
                        <input type="radio" name="sexo" id="macho">
                        <label for="macho"><span>♂</span>MACHO</label>
                        <input type="radio" name="sexo" id="hembra">
                        <label for="hembra"><span>♀</span>HEMBRA</label>
                        <input type="radio" name="sexo" id="nosabe">
                        <label for="nosabe"><span>?</span>NO SE SABE</label>
                    </section>
                </fieldset>
                <fieldset>
                    <legend>Tamaño</legend>
                    <section class="opciones">
                        <input type="radio" name="tamano" id="pequeno">
                        <label for="pequeno"><span class="chico">🐕</span>Pequeño</label>
                        <input type="radio" name="tamano" id="mediano">
                        <label for="mediano"><span class="medio">🐕</span>Mediano</label>
                        <input type="radio" name="tamano" id="grande">
                        <label for="grande"><span class="grande">🐕</span>Grande</label>
                    </section>
                </fieldset>
            </section>
        </form>
    </main>
</body>
</html>
